 const p=el.dataset.p;if(!p)return;const k=p.split('.'),l=k.pop();k.reduce((o,x)=>o[x],D)[l]=el.dataset.c?el.value.split(',').map(s=>s.trim()).filter(Boolean):el.value;render()});
document.addEventListener('submit',e=>{if(e.target.id!=='cf')return;e.preventDefault();const f=e.target,v=n=>f.elements[n].value.trim(),er={n:v('n').length<2?'Please enter your name.':'',m:/^\S+@\S+\.\S+$/.test(v('m'))?'':'Enter a valid email.',g:v('g').length<10?'Message needs at least 10 characters.':''};
 for(const k in er)$('#e-'+k).textContent=er[k];if(er.n||er.m||er.g)return;if(v('website'))return toast('Thanks!');
 location.href=`mailto:${P.email}?subject=${encodeURIComponent('Enquiry from '+v('n'))}&body=${encodeURIComponent(v('g')+'\n\n'+v('m'))}`});
render();
(async()=>{try{const r=await fetch('/api/content',{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(!j)return;if(j.profile)Object.assign(P,j.profile);['projects','skills','experience','updates'].forEach(k=>{if(Array.isArray(j[k]))D[k]=j[k]});fresh=false;render()}catch(e){}})();
